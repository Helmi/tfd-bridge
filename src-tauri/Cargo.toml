[package]
name = "tfd-bridge"
version = "0.7.0"
description = "TFD Bridge — local companion app for the TFD World of Warships community"
authors = []
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
bridge-core = { path = "../crates/bridge-core" }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["time"] }
# Engine-facing HTTP client (src/engine.rs). The feature choice mirrors
# tauri-plugin-updater's stack exactly (reqwest with rustls-no-provider, plus
# the ring provider pinned on rustls directly) so no second TLS stack is
# pulled into the build.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
# Donation uploader (src/uploader.rs): content hashing for the upload ledger
# and the engine's sha256 form field. Both crates are already in the
# dependency tree — zero new packages in the lock.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# Local mock engine for src/engine.rs + src/uploader.rs tests (no live
# network in cargo test); already in the tree via bridge-core.
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
