[package]
name = "tfd-bridge"
version = "0.19.0"
description = "TFD Bridge — local companion app for the TFD World of Warships community"
authors = []
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
bridge-core = { path = "../crates/bridge-core" }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["time", "sync"] }
# Engine-facing HTTP client (src/engine.rs). The feature choice mirrors
# tauri-plugin-updater's stack exactly (reqwest with rustls-no-provider, plus
# the ring provider pinned on rustls directly) so no second TLS stack is
# pulled into the build.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
# Donation uploader (src/uploader.rs): content hashing for the upload ledger
# and the engine's sha256 form field. Both crates are already in the
# dependency tree — zero new packages in the lock.
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Account service (td-27bcc9): DPoP proof / device-key plumbing reuses
# bridge-core's pure crypto (crates/bridge-core/src/dpop.rs, pkce.rs,
# login_flow.rs); this crate only adds the native OS-integration pieces.
async-trait = "0.1"
rand = "0.8"
base64 = "0.22"
# OS credential store for the device key + refresh tokens (contract v5
# section 1: "0.19.0 assumes a software EC P-256 key in the Windows
# Credential Manager (`keyring` 3.6.3 `windows-native`)"). Pinned exactly per
# that decision, not a floating minor.
keyring = { version = "=3.6.3", features = ["windows-native"] }

[dev-dependencies]
# Local mock engine for src/engine.rs + src/uploader.rs tests (no live
# network in cargo test); already in the tree via bridge-core.
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tempfile = "3"
# td-811657: compile-time assertion that `SignedRequestMaterial` (which
# carries the raw access token in its `Authorization` header) has no
# `Debug`/`Serialize` impl to accidentally leak it through.
static_assertions = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
# Single-instance guard: a second launch exits immediately and hands its argv
# to the already-running instance, which reveals its window (see lib.rs). Keeps
# the tray-resident app from ever spawning a duplicate process.
tauri-plugin-single-instance = "2"
