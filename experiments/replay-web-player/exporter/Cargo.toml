[package]
name = "tfd-replay-scene-exporter"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
gettext = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# wows-toolkit crates pinned to a public upstream commit so BOTH local dev and
# CI can build the exporter (previously a local `path` dep into the working
# tree, which CI has no access to). Rev = landaire/wows-toolkit `main` @
# 36c4e41 — the exact tree the scene decoder was built and validated against.
# Bump deliberately and re-validate the scene decode when advancing it.
wows_replays = { git = "https://github.com/landaire/wows-toolkit.git", rev = "36c4e41a6366115f3ddfc8355ca32d328e81625c", features = ["arc", "parsing", "vfs"] }
wowsunpack = { git = "https://github.com/landaire/wows-toolkit.git", rev = "36c4e41a6366115f3ddfc8355ca32d328e81625c", features = ["arc", "json", "parsing", "vfs-mmap"] }
wows-battle-world = { git = "https://github.com/landaire/wows-toolkit.git", rev = "36c4e41a6366115f3ddfc8355ca32d328e81625c", features = ["vfs"] }
wows_minimap_renderer = { git = "https://github.com/landaire/wows-toolkit.git", rev = "36c4e41a6366115f3ddfc8355ca32d328e81625c", default-features = false, features = ["rendering", "arc"] }

# Keep this disposable experiment out of the production TFD Bridge workspace.
[workspace]
