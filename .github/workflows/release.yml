name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          # The main workspace plus the standalone scene-exporter workspace
          # (its own [workspace], separate target dir) so repeat CI is fast.
          workspaces: |
            . -> target
            experiments/replay-web-player/exporter -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Build the bundled replay-player web UI (base=/player/, bridge API mode)
      # and stage it where the release overlay config expects it. src-tauri/player
      # is a build artifact (gitignored) served over loopback by the bridge.
      - name: Build replay-player web UI
        shell: bash
        run: |
          cd experiments/replay-web-player/web
          npm ci || npm install
          npm run build:bridge
          cd "$GITHUB_WORKSPACE"
          rm -rf src-tauri/player
          mkdir -p src-tauri/player
          cp -r experiments/replay-web-player/web/dist/. src-tauri/player/

      # Build the scene-exporter sidecar from its git-pinned wows-toolkit deps
      # and stage the binary for the overlay config to bundle as a resource.
      - name: Build scene-exporter sidecar
        shell: bash
        run: |
          cargo build --release --manifest-path experiments/replay-web-player/exporter/Cargo.toml
          mkdir -p src-tauri/binaries
          cp experiments/replay-web-player/exporter/target/release/tfd-replay-scene-exporter.exe src-tauri/binaries/tfd-replay-scene-exporter.exe

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # Match the literal "## [<version>]" heading via an awk variable
            # (index/prefix match, not a regex) so version or ref characters
            # can never be interpreted as regex / break awk.
            SECTION="$(awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{f=1;next} f&&/^## \[/{exit} f&&/^\[/{exit} f{print}' CHANGELOG.md)"
            if [ -z "$SECTION" ]; then
              SECTION="See CHANGELOG.md for details."
            fi
          else
            SECTION="Test build from ${GITHUB_REF_NAME} (not a tagged release)."
          fi
          BODY="${SECTION}

          ---
          *Windows installer — SmartScreen may show \"More info → Run anyway\". This is because the executable is not Authenticode-signed (no TFD legal entity for v1). The Tauri updater signature (ed25519) covers artifact integrity separately and is unrelated to SmartScreen.*"
          echo "body<<RELEASE_BODY_EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "RELEASE_BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: '.'
          # Overlay config (-c) adds the bundled scene-exporter + player UI
          # resources on top of the base config. Base builds stay unaffected.
          args: '--bundles nsis -c src-tauri/tauri.player.json'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'TFD Bridge ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Upload installer as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tfd-bridge-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
