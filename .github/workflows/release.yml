name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          args: '--bundles nsis'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'TFD Bridge ${{ github.ref_name }}'
          releaseBody: 'Windows installer — SmartScreen will show "More info → Run anyway" (unsigned for v1).'
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false

      - name: Upload installer as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tfd-bridge-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
