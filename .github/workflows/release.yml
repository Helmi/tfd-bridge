name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # Match the literal "## [<version>]" heading via an awk variable
            # (index/prefix match, not a regex) so version or ref characters
            # can never be interpreted as regex / break awk.
            SECTION="$(awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{f=1;next} f&&/^## \[/{exit} f&&/^\[/{exit} f{print}' CHANGELOG.md)"
            if [ -z "$SECTION" ]; then
              SECTION="See CHANGELOG.md for details."
            fi
          else
            SECTION="Test build from ${GITHUB_REF_NAME} (not a tagged release)."
          fi
          BODY="${SECTION}

          ---
          *Windows installer — SmartScreen may show \"More info → Run anyway\". This is because the executable is not Authenticode-signed (no TFD legal entity for v1). The Tauri updater signature (ed25519) covers artifact integrity separately and is unrelated to SmartScreen.*"
          echo "body<<RELEASE_BODY_EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "RELEASE_BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: '.'
          args: '--bundles nsis'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'TFD Bridge ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Upload installer as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tfd-bridge-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
