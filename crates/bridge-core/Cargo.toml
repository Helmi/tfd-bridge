[package]
name = "bridge-core"
version = "0.7.0"
edition = "2021"
description = "OS-agnostic logic for the TFD Bridge: detection, parsing, config"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tiny_http = "0.12"
notify = "6"
log = "0.4"
walkdir = "2"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
# In-process WoWS replay parsing. Pinned to Helmi/wows-toolkit (a fork of
# landaire/wows-toolkit, MIT, under our control). Shares ONE rev with the
# scene-export decoder (the replay player needs an API only present from
# 36c4e41). Current rev = landaire main b6a52397 (2026-09-30), mirrored as
# branch tfd-bridge/upstream-b6a52397 on the fork because upstream force-pushes
# main. See docs/wows-toolkit-rev.md. Bump both crates together.
wows_replays = { git = "https://github.com/Helmi/wows-toolkit", rev = "b6a5239735abf755cd2514fdf6365173dc9ce301" }
wowsunpack = { git = "https://github.com/Helmi/wows-toolkit", rev = "b6a5239735abf755cd2514fdf6365173dc9ce301", default-features = false, features = ["vfs-mmap"] }
# In-process replay → battle-scene decoder for the hidden replay player. Runs
# the decode in this process (no bundled sidecar / subprocess).
scene-export = { path = "../scene-export" }

[dev-dependencies]
tempfile = "3"
ureq = "2"
