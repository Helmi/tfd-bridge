[package]
name = "bridge-core"
version = "0.3.1"
edition = "2021"
description = "OS-agnostic logic for the TFD Bridge: detection, parsing, config"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tiny_http = "0.12"
notify = "6"
log = "0.4"
walkdir = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
ureq = "2"
