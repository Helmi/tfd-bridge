[package]
name = "bridge-core"
version = "0.5.0"
edition = "2021"
description = "OS-agnostic logic for the TFD Bridge: detection, parsing, config"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tiny_http = "0.12"
notify = "6"
log = "0.4"
walkdir = "2"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"
# In-process WoWS replay parsing (no bundled executable). Pinned to a fork of
# landaire/wows-toolkit (MIT) under our control.
wows_replays = { git = "https://github.com/Helmi/wows-toolkit", rev = "50301ee54630f38d7e8014d98e50e833e15fbea6" }
wowsunpack = { git = "https://github.com/Helmi/wows-toolkit", rev = "50301ee54630f38d7e8014d98e50e833e15fbea6", default-features = false, features = ["vfs-mmap"] }

[dev-dependencies]
tempfile = "3"
ureq = "2"
