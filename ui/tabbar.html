<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TFD Bridge — Profiles</title>
  <style>
    /* ── Bundled brand font (Space Grotesk, matches engine.tfd.rocks) ───────── */
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url("fonts/space-grotesk.woff2") format("woff2");
    }

    /* ── Brand tokens (copied from ui/index.html :root) ────────────────────── */
    :root {
      --bg:            #05070e;
      --surface:       #0e1624;
      --surface-2:     #11192a;
      --border:        rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.16);
      --fg:            #dfe6e8;
      --fg-muted:      #8a949a;
      --fg-faint:      #5e676d;
      --accent:        #00d1a7;
      --accent-soft:   rgba(0, 209, 167, 0.12);
      --danger:        #e05563;
      --topbar-h:      40px;
      --tabstrip-h:    34px;
      --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-sans);
      color: var(--fg);
      background: var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Frameless topbar (drag region + window controls) ──────────────────── */
    .topbar {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.45rem 0 0.85rem;
      background: rgba(5, 7, 14, 0.72);
      border-bottom: 1px solid var(--border);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
    }
    .topbar-brand svg { display: block; width: 18px; height: 18px; }
    .topbar-title {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--fg);
    }
    .topbar-title .accent { color: var(--accent); }

    .win-controls { display: flex; align-items: center; gap: 2px; }
    .win-btn {
      width: 30px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--fg-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .win-btn svg { display: block; width: 12px; height: 12px; }
    .win-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--fg); }
    .win-btn.close:hover { background: var(--danger); color: #fff; }

    /* ── Tab strip ─────────────────────────────────────────────────────────── */
    .tabstrip {
      height: var(--tabstrip-h);
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 0 0.35rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
    }
    .tabstrip::-webkit-scrollbar { height: 0; }

    .tab {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      max-width: 200px;
      min-width: 90px;
      padding: 0 0.3rem 0 0.65rem;
      margin: 4px 0;
      border-radius: 7px;
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 500;
      border: 1px solid transparent;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .tab:hover { background: var(--surface-2); color: var(--fg); }
    .tab.active {
      background: var(--accent-soft);
      color: var(--fg);
      border-color: var(--accent);
    }
    .tab-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-close {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--fg-faint);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .tab-close svg { display: block; width: 9px; height: 9px; }
    .tab-close:hover { background: var(--danger); color: #fff; }

    .tab-new {
      flex-shrink: 0;
      align-self: center;
      width: 26px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--fg-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .tab-new svg { display: block; width: 13px; height: 13px; }
    .tab-new:hover { background: var(--surface-2); color: var(--accent); }

    .tab-empty {
      display: flex;
      align-items: center;
      padding: 0 0.65rem;
      color: var(--fg-faint);
      font-size: 0.74rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- ── Frameless topbar ──────────────────────────────────────────────────── -->
  <header class="topbar" data-tauri-drag-region>
    <div class="topbar-brand" data-tauri-drag-region>
      <svg viewBox="0 0 24 24" fill="none" stroke="#00d1a7" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 10.189V14" />
        <path d="M12 2v3" />
        <path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6" />
        <path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76" />
        <path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" />
      </svg>
      <span class="topbar-title">TFD <span class="accent">Bridge</span> · Profiles</span>
    </div>
    <div class="win-controls">
      <button class="win-btn" id="win-minimize" type="button" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="2" y1="6" x2="10" y2="6" />
        </svg>
      </button>
      <button class="win-btn close" id="win-close" type="button" title="Close" aria-label="Close">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="3" y1="3" x2="9" y2="9" />
          <line x1="9" y1="3" x2="3" y2="9" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Tab strip ─────────────────────────────────────────────────────────── -->
  <nav class="tabstrip" id="tabstrip" aria-label="Open profiles"></nav>

<script>
  // Tauri v2 globals (withGlobalTauri: true in tauri.conf.json).
  const invoke = (...args) => window.__TAURI__.core.invoke(...args);
  const tauriEvent = window.__TAURI__.event;
  const appWindow = window.__TAURI__.window.getCurrentWindow();

  // ── Frameless window controls ─────────────────────────────────────────────
  // The tabs window is NOT close-to-tray (only "main" is, per the Rust
  // CloseRequested handler) — closing here really closes the window.
  document.getElementById('win-minimize').addEventListener('click', () => {
    appWindow.minimize();
  });
  document.getElementById('win-close').addEventListener('click', () => {
    appWindow.close();
  });

  // ── Tab strip rendering ───────────────────────────────────────────────────
  const strip = document.getElementById('tabstrip');

  function makeCloseIcon() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 12 12');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.6');
    svg.setAttribute('stroke-linecap', 'round');
    for (const [x1, y1, x2, y2] of [[3, 3, 9, 9], [9, 3, 3, 9]]) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      svg.appendChild(line);
    }
    return svg;
  }

  function makePlusIcon() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 12 12');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.6');
    svg.setAttribute('stroke-linecap', 'round');
    for (const [x1, y1, x2, y2] of [[6, 2, 6, 10], [2, 6, 10, 6]]) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      svg.appendChild(line);
    }
    return svg;
  }

  function renderTab(tab) {
    const el = document.createElement('div');
    el.className = tab.active ? 'tab active' : 'tab';
    el.setAttribute('role', 'tab');
    el.setAttribute('aria-selected', String(!!tab.active));
    el.title = tab.url;

    const title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = tab.title || 'Profile';

    const closeBtn = document.createElement('button');
    closeBtn.className = 'tab-close';
    closeBtn.type = 'button';
    closeBtn.title = 'Close tab';
    closeBtn.setAttribute('aria-label', 'Close tab');
    closeBtn.appendChild(makeCloseIcon());

    // Clicking the tab body switches to it; clicking the ✕ closes it.
    el.addEventListener('click', () => {
      invoke('tab_switch', { label: tab.label }).catch((e) => console.warn('tab_switch failed:', e));
    });
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      invoke('tab_close', { label: tab.label }).catch((e2) => console.warn('tab_close failed:', e2));
    });

    el.append(title, closeBtn);
    return el;
  }

  async function reloadTabs() {
    let tabs = [];
    try {
      tabs = await invoke('tab_list');
    } catch (e) {
      console.warn('tab_list failed:', e);
    }
    strip.replaceChildren();

    if (!tabs || tabs.length === 0) {
      const empty = document.createElement('span');
      empty.className = 'tab-empty';
      empty.textContent = 'No open profiles';
      strip.appendChild(empty);
    } else {
      for (const tab of tabs) strip.appendChild(renderTab(tab));
    }

    // Trailing "+" opens a fresh tab on the monitor root.
    const newBtn = document.createElement('button');
    newBtn.className = 'tab-new';
    newBtn.type = 'button';
    newBtn.title = 'New tab';
    newBtn.setAttribute('aria-label', 'New tab');
    newBtn.appendChild(makePlusIcon());
    newBtn.addEventListener('click', () => {
      invoke('tab_new').catch((e) => console.warn('tab_new failed:', e));
    });
    strip.appendChild(newBtn);
  }

  // Rust emits 'tabs-changed' after every registry mutation.
  tauriEvent
    .listen('tabs-changed', () => reloadTabs())
    .catch((e) => console.warn('tabs-changed listen failed:', e));

  reloadTabs();
</script>
</body>
</html>
